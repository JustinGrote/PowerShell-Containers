name: Build and Publish PowerShell Containers

on:
  push:
    branches:
      - main
    paths:
      - build.ps1
      - .github/workflows/build-and-publish.yml
  workflow_dispatch:
    inputs:
      imageName:
        description: 'Container image name (e.g. powershell-test)'
        required: true
        default: 'powershell-test'

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: Github Container Registry - Test

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Podman
      run: |
        # Must be run as root
        if [ "$EUID" -ne 0 ]; then
          echo "Please run as root (e.g., sudo $0)"
          exit 1
        fi

        # Define file paths
        PINNING_FILE="/etc/apt/preferences.d/podman-plucky.pref"
        SOURCE_LIST="/etc/apt/sources.list.d/plucky.list"

        # Write Plucky APT source list
        echo "Adding Plucky repo to $SOURCE_LIST..."
        echo "deb http://archive.ubuntu.com/ubuntu plucky main universe" > "$SOURCE_LIST"

        # Write APT pinning rules
        echo "Writing APT pinning rules to $PINNING_FILE..."
        cat <<EOF > "$PINNING_FILE"
        Package: podman buildah golang-github-containers-common crun libgpgme11t64 libgpg-error0 golang-github-containers-image catatonit conmon containers-storage
        Pin: release n=plucky
        Pin-Priority: 991

        Package: libsubid4 netavark passt aardvark-dns containernetworking-plugins libslirp0 slirp4netns
        Pin: release n=plucky
        Pin-Priority: 991

        Package: *
        Pin: release n=plucky
        Pin-Priority: 400
        EOF

        # Update APT cache
        echo "Updating APT package list..."
        apt update

        echo "Plucky pinning setup complete."

    - name: Get lowercase repository owner
      id: repo_owner
      run: echo "repo_owner_lower=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

    - name: Log in to GitHub Container Registry with Podman
      uses: redhat-actions/podman-login@v1
      with:
        registry: ghcr.io/${{ env.repo_owner_lower }}
        username: ${{ env.repo_owner_lower }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and publish containers
      shell: pwsh
      run: ./build.ps1 -Push -RemoteImageName "ghcr.io/${{ github.repository_owner }}/${{ github.event.inputs.imageName }}" -Versions '7.5.2','7.4.11','7.4.9'

    - name: List built images
      run: podman images --filter reference=powershell --format "table {{.Repository}}:{{.Tag}} {{.Size}} {{.Created}}"